# CI gate: runs the same canonical suite as `python scripts/run_all_tests.py`
# (golden regen → pytest → vitest → tsc --noEmit → dead-code strict gate).
# The suite is network-free by design (US-21.1 network guard + US-21.4 frozen
# goldens), so no FMP_API_KEY or other secrets are required here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/quant-engine/requirements.txt
            services/quant-engine/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install backend dependencies (incl. dead-code tooling)
        run: pip install -r services/quant-engine/requirements-dev.txt

      - name: Install desktop dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Run full test suite (pytest + vitest + tsc + dead-code gate)
        run: python scripts/run_all_tests.py
