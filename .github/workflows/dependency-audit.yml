# Dependency-vulnerability visibility (Epic 36 / US-36.2 / T-36.2.2).
#
# Runs scripts/audit_dependencies.py (pip-audit against
# services/quant-engine/requirements.txt + npm audit against apps/desktop)
# and surfaces the outcome via $GITHUB_STEP_SUMMARY and this job's own
# pass/fail status.
#
# Deliberately SEPARATE from ci.yml / scripts/run_all_tests.py: both
# pip-audit and npm audit require live network access to a vulnerability
# database (PyPI Advisory DB / OSV; npm's advisory endpoint), which would
# silently reintroduce a network dependency into the network-free suite
# (US-21.1 network guard + US-21.4 frozen goldens). Triggers are therefore
# `schedule` + `workflow_dispatch` ONLY — never `pull_request`/`push`, which
# would re-couple this scan to the commit/PR gate and reopen exactly the
# network dependency the network-free design removed.
#
# Exit-code contract (see scripts/audit_dependencies.py):
#   0  both ecosystems CLEAN                    -> job passes
#   1  at least one ecosystem VULNERABILITIES_FOUND -> job FAILS
#   3  no vulnerabilities, but at least one ecosystem SCAN_UNAVAILABLE
#      (e.g. the advisory database was unreachable) -> job does NOT fail,
#      but the summary says so plainly so a network hiccup isn't silently
#      swallowed as if it were a clean scan.
name: Dependency audit

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/quant-engine/requirements.txt
            services/quant-engine/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install backend dependencies (incl. pip-audit)
        run: pip install -r services/quant-engine/requirements-dev.txt

      - name: Install desktop dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Run dependency audit
        id: audit
        shell: bash
        run: |
          set +e
          python scripts/audit_dependencies.py >audit_output.txt 2>&1
          exit_code=$?
          set -e
          cat audit_output.txt
          echo "exit_code=${exit_code}" >>"$GITHUB_OUTPUT"

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Dependency audit result"
            echo
            echo '```'
            cat audit_output.txt
            echo '```'
            echo
          } >>"$GITHUB_STEP_SUMMARY"

          exit_code="${{ steps.audit.outputs.exit_code }}"
          if [ "${exit_code}" = "1" ]; then
            echo "**VULNERABILITIES FOUND** — see the per-ecosystem outcome above. Failing this job." >>"$GITHUB_STEP_SUMMARY"
          elif [ "${exit_code}" = "3" ]; then
            echo "**SCAN UNAVAILABLE** — at least one ecosystem's scan could not run (e.g. the vulnerability database was unreachable). This is NOT a vulnerability finding and does not fail the job, but the scan did not complete: re-run via workflow_dispatch or wait for the next schedule." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "Both ecosystems clean (exit code ${exit_code})." >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail job on real findings
        if: steps.audit.outputs.exit_code == '1'
        run: |
          echo "scripts/audit_dependencies.py reported VULNERABILITIES_FOUND (exit 1). See job summary for the per-ecosystem breakdown." >&2
          exit 1
