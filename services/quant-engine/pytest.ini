[pytest]
; US-21.1 — deterministic suite: no live network in the default test run.
; --disable-socket blocks real connections (pytest-socket); loopback stays
; allowed because Windows asyncio / in-process TestClient use 127.0.0.1
; socketpairs internally. External hosts (FMP, Yahoo) are blocked, so a test
; that forgets to mock market data fails loudly instead of silently passing
; online and failing offline.
; Tests that MUST hit live providers are marked live_data (+ enable_socket)
; and are deselected by default — run them explicitly with: pytest -m live_data
addopts = --disable-socket --allow-hosts=127.0.0.1,::1 --allow-unix-socket -m "not live_data"
markers =
    live_data: intentionally hits live provider networks; excluded from the default run (pytest -m live_data)
