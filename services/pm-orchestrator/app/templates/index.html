{% extends "base.html" %}

{% block content %}
<section class="panel composer-panel">
  <h1>Start `/pm` Run</h1>
  <form action="/runs" method="post" class="composer-form">
    <textarea name="input_text" rows="7" placeholder="/pm Design a PM-led specialist orchestration flow for ranking backend work" required></textarea>
    <button type="submit">Run `/pm`</button>
  </form>
</section>

<section class="panel runs-panel">
  <h2>Recent Runs</h2>
  {% if runs %}
    <ul class="run-list">
      {% for run in runs %}
        <li>
          <a href="/runs/{{ run.id }}">{{ run.user_input }}</a>
          <span class="status status-{{ run.status }}">{{ run.status }}</span>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No runs yet.</p>
  {% endif %}
</section>
{% endblock %}
